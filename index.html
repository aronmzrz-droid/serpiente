<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SERPIENTE // PROTOCOLO NEXUS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00f0c0">
<link rel="apple-touch-icon" href="icon-192.png">
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
</script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #050a14;
    --bg2: #0a1525;
    --cyan: #00f0c0;
    --cyan-dim: #005060;
    --pink: #ff4af0;
    --blue: #5b8fff;
    --orange: #ff7c3b;
    --red: #ff3a3a;
    --text: #c8e0ee;
    --text-dim: #4a6880;
    --border: rgba(0,240,192,0.15);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Courier New', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    overflow: hidden;
  }

  /* Animated grid bg */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,240,192,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,240,192,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* Corner decorations */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 0% 0%, rgba(91,143,255,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 100% 100%, rgba(255,74,240,0.05) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 540px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* Header */
  .header {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 16px;
  }

  .eyebrow {
    font-size: 10px;
    letter-spacing: 4px;
    color: var(--cyan);
    text-transform: uppercase;
    opacity: 0.7;
    margin-bottom: 4px;
  }

  .title {
    font-size: clamp(22px, 5vw, 32px);
    font-weight: 700;
    letter-spacing: 6px;
    color: #fff;
    text-shadow: 0 0 30px rgba(0,240,192,0.4);
    text-transform: uppercase;
  }

  .title span { color: var(--cyan); }

  /* HUD */
  .hud {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-bottom: 10px;
  }

  .hud-cell {
    background: var(--bg2);
    border: 1px solid var(--border);
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .hud-cell:first-child { border-radius: 6px 0 0 6px; }
  .hud-cell:last-child { border-radius: 0 6px 6px 0; text-align: right; }
  .hud-cell:nth-child(2) { text-align: center; border-left: none; border-right: none; }

  .hud-label {
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  .hud-value {
    font-size: 22px;
    font-weight: 700;
    color: var(--cyan);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  #lives-display { font-size: 16px; }

  /* Canvas wrapper */
  .canvas-wrap {
    position: relative;
    width: 100%;
    border: 1px solid var(--border);
    background: var(--bg);
    overflow: hidden;
  }

  .corner {
    position: absolute;
    width: 16px;
    height: 16px;
    z-index: 2;
    pointer-events: none;
  }
  .corner-tl { top: 0; left: 0; border-top: 2px solid var(--cyan); border-left: 2px solid var(--cyan); }
  .corner-tr { top: 0; right: 0; border-top: 2px solid var(--cyan); border-right: 2px solid var(--cyan); }
  .corner-bl { bottom: 0; left: 0; border-bottom: 2px solid var(--cyan); border-left: 2px solid var(--cyan); }
  .corner-br { bottom: 0; right: 0; border-bottom: 2px solid var(--cyan); border-right: 2px solid var(--cyan); }

  #canvas {
    display: block;
    width: 100%;
    height: auto;
    image-rendering: pixelated;
  }

  /* Overlay */
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(5,10,20,0.88);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    z-index: 10;
    transition: opacity 0.3s;
  }

  #overlay.hidden { opacity: 0; pointer-events: none; }

  .overlay-title {
    font-size: clamp(18px, 4vw, 28px);
    letter-spacing: 6px;
    font-weight: 700;
    text-transform: uppercase;
  }

  .overlay-title.danger { color: var(--red); text-shadow: 0 0 20px rgba(255,58,58,0.5); }
  .overlay-title.ready { color: var(--cyan); text-shadow: 0 0 20px rgba(0,240,192,0.4); }

  .overlay-score {
    font-size: 14px;
    color: var(--text-dim);
    letter-spacing: 2px;
  }

  .overlay-score span { color: var(--cyan); }

  .btn-start {
    margin-top: 8px;
    padding: 10px 32px;
    background: transparent;
    border: 1px solid var(--cyan);
    color: var(--cyan);
    font-family: 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 3px;
    transition: background 0.2s, box-shadow 0.2s;
  }

  .btn-start:hover {
    background: rgba(0,240,192,0.1);
    box-shadow: 0 0 20px rgba(0,240,192,0.2);
  }

  /* Legend */
  .legend {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-top: none;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 1px;
  }

  .legend-item { display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot-food { background: #ff4af0; }
  .dot-portal { background: linear-gradient(135deg, #5b8fff, #ff7c3b); }
  .dot-wall { background: #ff3a3a; }

  /* Controls hint */
  .controls {
    width: 100%;
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 10px;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 1px;
  }

  .key {
    display: inline-block;
    padding: 2px 6px;
    border: 1px solid var(--text-dim);
    border-radius: 3px;
    font-size: 9px;
    color: var(--text);
    margin: 0 1px;
    opacity: 0.7;
  }

  /* Mobile D-pad */
  .dpad {
    display: none;
    grid-template-columns: 44px 44px 44px;
    grid-template-rows: 44px 44px 44px;
    gap: 4px;
    margin-top: 14px;
  }

  @media (max-width: 600px) { .dpad { display: grid; } }

  .dpad-btn {
    background: var(--bg2);
    border: 1px solid var(--border);
    color: var(--cyan);
    font-size: 18px;
    cursor: pointer;
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.1s;
  }

  .dpad-btn:active { background: rgba(0,240,192,0.15); }
  .dpad-up    { grid-column: 2; grid-row: 1; }
  .dpad-left  { grid-column: 1; grid-row: 2; }
  .dpad-center{ grid-column: 2; grid-row: 2; background: transparent; border: none; color: var(--text-dim); font-size: 10px; }
  .dpad-right { grid-column: 3; grid-row: 2; }
  .dpad-down  { grid-column: 2; grid-row: 3; }

  /* Scanline effect */
  .scanlines {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 3px,
      rgba(0,0,0,0.07) 3px,
      rgba(0,0,0,0.07) 4px
    );
    pointer-events: none;
    z-index: 1;
  }

  /* Level up flash */
  @keyframes levelFlash {
    0%   { box-shadow: inset 0 0 40px rgba(0,240,192,0.4); }
    100% { box-shadow: none; }
  }
  .canvas-wrap.levelup { animation: levelFlash 0.5s ease-out; }
</style>
</head>
<body>

<div class="container">

  <div class="header">
    <div class="eyebrow">// NEXUS CORP — SISTEMA DE ENTRENAMIENTO v4.2</div>
    <div class="title">SERP<span>IENTE</span></div>
  </div>

  <div class="hud">
    <div class="hud-cell">
      <div class="hud-label">Puntos</div>
      <div class="hud-value" id="score">000</div>
    </div>
    <div class="hud-cell">
      <div class="hud-label">Nivel</div>
      <div class="hud-value" id="level">01</div>
    </div>
    <div class="hud-cell">
      <div class="hud-label">Vidas</div>
      <div class="hud-value" id="lives-display">♦ ♦ ♦</div>
    </div>
  </div>

  <div class="canvas-wrap" id="canvas-wrap">
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>
    <div class="scanlines"></div>

    <canvas id="canvas" width="480" height="480"></canvas>

    <div id="overlay">
      <div class="overlay-title ready" id="ov-title">PROTOCOLO NEXUS</div>
      <div class="overlay-score" id="ov-score">Controla la serpiente cuántica</div>
      <button class="btn-start" id="btn-start">INICIAR PROTOCOLO</button>
    </div>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="dot dot-food"></div> Dato (comer)</div>
    <div class="legend-item"><div class="dot dot-portal"></div> Portales (niv. 3+)</div>
    <div class="legend-item"><div class="dot dot-wall"></div> Firewall (niv. 2+)</div>
  </div>

  <div class="controls">
    <div><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> o <span class="key">↑</span><span class="key">←</span><span class="key">↓</span><span class="key">→</span> mover &nbsp;·&nbsp; <span class="key">SPACE</span> reiniciar</div>
  </div>

  <div class="dpad">
    <button class="dpad-btn dpad-up"    data-dir="up">▲</button>
    <button class="dpad-btn dpad-left"  data-dir="left">◀</button>
    <div class="dpad-center">D‑PAD</div>
    <button class="dpad-btn dpad-right" data-dir="right">▶</button>
    <button class="dpad-btn dpad-down"  data-dir="down">▼</button>
  </div>

</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = 480, H = 480, CELL = 20, COLS = W/CELL, ROWS = H/CELL;

let snake, dir, nextDir, food, portals, obstacles, particles;
let score, level, lives, gameState, speed, frame, animId, lastTime;

const C = {
  head: '#00f0c0', bodyHi: '#00c0a0', bodyMid: '#007060', bodyLo: '#003840',
  food: '#ff4af0', portal0: '#5b8fff', portal1: '#ff7c3b',
  obs: '#ff3a3a', obsBg: '#1a0505',
  bg: '#050a14', grid: 'rgba(0,240,192,0.04)',
  pColors: ['#00f0c0','#ff4af0','#5b8fff','#ffd700','#ff7c3b']
};

function init() {
  snake = [{x:12,y:12},{x:11,y:12},{x:10,y:12},{x:9,y:12}];
  dir = {x:1,y:0}; nextDir = {x:1,y:0};
  score = 0; level = 1; lives = 3; speed = 130;
  particles = []; portals = []; obstacles = [];
  gameState = 'playing'; frame = 0; lastTime = 0;
  updateHUD();
  placeFood();
  hideOverlay();
}

function updateHUD() {
  document.getElementById('score').textContent = String(score).padStart(3,'0');
  document.getElementById('level').textContent = String(level).padStart(2,'0');
  const livesMap = ['○ ○ ○','♦ ○ ○','♦ ♦ ○','♦ ♦ ♦'];
  document.getElementById('lives-display').textContent = livesMap[Math.max(0,Math.min(3,lives))];
}

function showOverlay(title, subtitle, btnText, danger) {
  const ov = document.getElementById('overlay');
  document.getElementById('ov-title').textContent = title;
  document.getElementById('ov-title').className = 'overlay-title ' + (danger ? 'danger' : 'ready');
  document.getElementById('ov-score').innerHTML = subtitle;
  document.getElementById('btn-start').textContent = btnText;
  ov.classList.remove('hidden');
}

function hideOverlay() {
  document.getElementById('overlay').classList.add('hidden');
}

function placeFood() {
  let pos, t = 0;
  do { pos = {x:Math.floor(Math.random()*COLS), y:Math.floor(Math.random()*ROWS)}; t++; }
  while (t < 200 && (onSnake(pos) || onObs(pos)));
  food = pos;
  if (level >= 2) spawnObstacles();
  if (level >= 3) spawnPortals();
}

function spawnObstacles() {
  let count = Math.min(level * 2 + 2, 16);
  obstacles = [];
  for (let i = 0; i < count; i++) {
    let pos, t = 0;
    do { pos = {x:Math.floor(Math.random()*COLS), y:Math.floor(Math.random()*ROWS)}; t++; }
    while (t < 100 && (onSnake(pos) || (pos.x===food.x&&pos.y===food.y) || near(pos,snake[0],4) || onObs(pos)));
    if (t < 100) obstacles.push(pos);
  }
}

function spawnPortals() {
  portals = [];
  for (let i = 0; i < 2; i++) {
    let pos, t = 0;
    do { pos = {x:Math.floor(Math.random()*COLS), y:Math.floor(Math.random()*ROWS)}; t++; }
    while (t < 100 && (onSnake(pos) || onObs(pos) || (pos.x===food.x&&pos.y===food.y) || portals.some(p=>p.x===pos.x&&p.y===pos.y)));
    if (t < 100) portals.push(pos);
  }
}

function near(a,b,d) { return Math.abs(a.x-b.x)+Math.abs(a.y-b.y)<d; }
function onSnake(p) { return snake.some(s=>s.x===p.x&&s.y===p.y); }
function onObs(p) { return obstacles.some(o=>o.x===p.x&&o.y===p.y); }

function loop(ts) {
  animId = requestAnimationFrame(loop);
  updateParticles();
  draw();
  if (gameState !== 'playing') return;
  if (ts - lastTime < speed) return;
  lastTime = ts;
  frame++;
  update();
}

function update() {
  dir = nextDir;
  let head = {x:(snake[0].x+dir.x+COLS)%COLS, y:(snake[0].y+dir.y+ROWS)%ROWS};

  // portal
  let pi = portals.findIndex(p=>p.x===head.x&&p.y===head.y);
  if (pi !== -1) {
    let ex = portals[1-pi];
    spawnParticles(ex.x*CELL+CELL/2, ex.y*CELL+CELL/2, C.portal0, 14);
    head = {x:(ex.x+dir.x+COLS)%COLS, y:(ex.y+dir.y+ROWS)%ROWS};
  }

  if (onObs(head) || onSnake(head)) { die(); return; }

  snake.unshift(head);

  if (head.x===food.x && head.y===food.y) {
    let pts = 10 * level;
    score += pts;
    spawnParticles(food.x*CELL+CELL/2, food.y*CELL+CELL/2, C.food, 20);
    let threshold = level * 80;
    if (score >= threshold) {
      level++;
      speed = Math.max(50, speed - 14);
      document.getElementById('canvas-wrap').classList.add('levelup');
      setTimeout(()=>document.getElementById('canvas-wrap').classList.remove('levelup'),500);
    }
    updateHUD();
    placeFood();
  } else {
    snake.pop();
  }
}

function die() {
  lives--;
  updateHUD();
  spawnParticles(snake[0].x*CELL+CELL/2, snake[0].y*CELL+CELL/2, C.obs, 28);
  if (lives <= 0) {
    gameState = 'over';
    setTimeout(()=>{
      showOverlay('SISTEMA CAÍDO', `Puntaje final: <span>${score}</span> &nbsp;·&nbsp; Nivel: <span>${level}</span>`, 'REINICIAR PROTOCOLO', true);
    }, 700);
  } else {
    snake = [{x:12,y:12},{x:11,y:12},{x:10,y:12}];
    dir = {x:1,y:0}; nextDir = {x:1,y:0};
  }
}

function spawnParticles(x,y,color,n) {
  for (let i=0;i<n;i++) {
    let a = Math.random()*Math.PI*2, spd = 1.5+Math.random()*3.5;
    particles.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:1,color:color||C.pColors[Math.floor(Math.random()*C.pColors.length)]});
  }
}

function updateParticles() {
  for (let p of particles) { p.x+=p.vx; p.y+=p.vy; p.vx*=0.91; p.vy*=0.91; p.life-=0.028; }
  particles = particles.filter(p=>p.life>0);
}

function draw() {
  ctx.fillStyle = C.bg;
  ctx.fillRect(0,0,W,H);

  // Grid
  ctx.strokeStyle = C.grid; ctx.lineWidth = 0.5;
  for (let x=0;x<=W;x+=CELL) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y=0;y<=H;y+=CELL) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  // Obstacles
  for (let o of obstacles) {
    let px=o.x*CELL, py=o.y*CELL;
    ctx.fillStyle = C.obsBg; ctx.fillRect(px+1,py+1,CELL-2,CELL-2);
    ctx.strokeStyle = C.obs; ctx.lineWidth=1;
    ctx.strokeRect(px+3,py+3,CELL-6,CELL-6);
    ctx.fillStyle = C.obs; ctx.fillRect(px+8,py+8,4,4);
  }

  // Portals
  portals.forEach((p,i)=>{
    let px=p.x*CELL+CELL/2, py=p.y*CELL+CELL/2;
    let col = i===0 ? C.portal0 : C.portal1;
    let pulse = 0.5+0.5*Math.sin(frame*0.15+i*Math.PI);
    ctx.beginPath(); ctx.arc(px,py,7+pulse*3,0,Math.PI*2);
    ctx.fillStyle = col+'22'; ctx.fill();
    ctx.beginPath(); ctx.arc(px,py,5,0,Math.PI*2);
    ctx.strokeStyle=col; ctx.lineWidth=1.5; ctx.stroke();
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc(px,py,2.5,0,Math.PI*2); ctx.fill();
    // ring
    ctx.beginPath(); ctx.arc(px,py,9+pulse*2,0,Math.PI*2);
    ctx.strokeStyle=col+'55'; ctx.lineWidth=0.5; ctx.stroke();
  });

  // Food
  if (food) {
    let fx=food.x*CELL+CELL/2, fy=food.y*CELL+CELL/2;
    let pulse=0.5+0.5*Math.sin(frame*0.2);
    ctx.beginPath(); ctx.arc(fx,fy,6+pulse*3,0,Math.PI*2);
    ctx.fillStyle='#ff4af033'; ctx.fill();
    ctx.beginPath(); ctx.arc(fx,fy,4,0,Math.PI*2);
    ctx.fillStyle=C.food; ctx.fill();
    ctx.strokeStyle='#fff5'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(fx-2.5,fy); ctx.lineTo(fx+2.5,fy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(fx,fy-2.5); ctx.lineTo(fx,fy+2.5); ctx.stroke();
  }

  // Snake
  for (let i=snake.length-1;i>=0;i--) {
    let s=snake[i], px=s.x*CELL, py=s.y*CELL;
    let t=i/snake.length;
    if (i===0) {
      // Head
      ctx.fillStyle=C.head;
      roundRect(ctx, px+1,py+1,CELL-2,CELL-2,3); ctx.fill();
      // Eyes
      let ex=dir.x, ey=dir.y;
      let eye1={x:px+CELL/2+ey*4-ex*1-2, y:py+CELL/2-ex*4-ey*1-2};
      let eye2={x:px+CELL/2-ey*4-ex*1-2, y:py+CELL/2+ex*4-ey*1-2};
      ctx.fillStyle=C.bg;
      ctx.fillRect(eye1.x,eye1.y,4,4);
      ctx.fillRect(eye2.x,eye2.y,4,4);
      ctx.fillStyle='#fff';
      ctx.fillRect(eye1.x+1,eye1.y+1,2,2);
      ctx.fillRect(eye2.x+1,eye2.y+1,2,2);
    } else {
      let r = Math.floor(0*(1-t)+0*t), g = Math.floor(240*(1-t*0.85)), b = Math.floor(192*(1-t*0.75));
      let a = 0.2+0.8*(1-t);
      ctx.fillStyle=`rgba(${r},${g},${b},${a})`;
      let ins=1+t*2.5;
      ctx.fillRect(px+ins,py+ins,CELL-ins*2,CELL-ins*2);
      if (i%4===0) {
        ctx.fillStyle=`rgba(0,240,192,${0.4*(1-t)})`;
        ctx.fillRect(px+CELL/2-1.5,py+CELL/2-1.5,3,3);
      }
    }
  }

  // Particles
  for (let p of particles) {
    ctx.globalAlpha=p.life;
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x-2,p.y-2,4,4);
  }
  ctx.globalAlpha=1;
}

function roundRect(ctx,x,y,w,h,r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

// Controls
document.addEventListener('keydown', e=>{
  if (e.code==='Space'||e.code==='Enter') {
    if (gameState!=='playing') init();
    e.preventDefault(); return;
  }
  const map={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},
             KeyW:{x:0,y:-1},KeyS:{x:0,y:1},KeyA:{x:-1,y:0},KeyD:{x:1,y:0}};
  let nd=map[e.code];
  if (nd && !(nd.x===-dir.x&&nd.y===-dir.y)) { nextDir=nd; e.preventDefault(); }
});

document.getElementById('btn-start').addEventListener('click',()=>{
  if (gameState!=='playing') init();
});

// D-pad
document.querySelectorAll('.dpad-btn').forEach(btn=>{
  const press = ()=>{
    if (gameState!=='playing') { init(); return; }
    const map={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
    let nd=map[btn.dataset.dir];
    if (nd && !(nd.x===-dir.x&&nd.y===-dir.y)) nextDir=nd;
  };
  btn.addEventListener('touchstart',e=>{e.preventDefault();press();},{passive:false});
  btn.addEventListener('mousedown',press);
});

// Swipe
let tx0,ty0;
canvas.addEventListener('touchstart',e=>{tx0=e.touches[0].clientX;ty0=e.touches[0].clientY;},{passive:true});
canvas.addEventListener('touchend',e=>{
  if (gameState!=='playing') { init(); return; }
  let dx=e.changedTouches[0].clientX-tx0, dy=e.changedTouches[0].clientY-ty0;
  if (Math.abs(dx)<10&&Math.abs(dy)<10) return;
  let nd;
  if (Math.abs(dx)>Math.abs(dy)) nd=dx>0?{x:1,y:0}:{x:-1,y:0};
  else nd=dy>0?{x:0,y:1}:{x:0,y:-1};
  if (!(nd.x===-dir.x&&nd.y===-dir.y)) nextDir=nd;
},{passive:true});

// Init game state vars (don't auto-start)
snake=[{x:12,y:12},{x:11,y:12},{x:10,y:12},{x:9,y:12}];
dir={x:1,y:0}; nextDir={x:1,y:0};
score=0;level=1;lives=3;speed=130;frame=0;lastTime=0;
particles=[];portals=[];obstacles=[];
food={x:18,y:12};
gameState='idle';

// Draw initial frame
draw();
requestAnimationFrame(loop);
</script>
</body>
</html>
